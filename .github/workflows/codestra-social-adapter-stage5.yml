name: Codestra Social Adapter Stage 5

on:
  pull_request:
    paths:
      - 'integrations/codestra-social/**'
      - 'deploy/staging/**'
      - 'monitoring/prometheus.staging.yml'
      - 'var/docker/secret-env.mjs'
      - 'governance/release-policy.json'
      - 'docs/features/social-publish-readback.md'
      - 'scripts/social-staging-preflight'
      - 'scripts/validate_codestra_social_adapter.py'
      - '.github/workflows/codestra-social-adapter-stage5.yml'
  push:
    branches:
      - main
    paths:
      - 'integrations/codestra-social/**'
      - 'deploy/staging/**'
      - 'monitoring/prometheus.staging.yml'
      - 'var/docker/secret-env.mjs'
      - 'governance/release-policy.json'
      - 'docs/features/social-publish-readback.md'
      - 'scripts/social-staging-preflight'
      - 'scripts/validate_codestra_social_adapter.py'
      - '.github/workflows/codestra-social-adapter-stage5.yml'

permissions:
  contents: read

jobs:
  certify:
    name: Social adapter contract and staging safety
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact source identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate static contract and fail-closed controls
        run: python scripts/validate_codestra_social_adapter.py
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.0
      - name: Use supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --package-import-method=copy --child-concurrency=1
      - name: Test adapter behavior
        run: >-
          pnpm exec jest --runInBand --coverage=false
          --config integrations/codestra-social/jest.config.cjs
