openapi: 3.1.0
info:
  title: Codestra Social private control API
  version: 1.0.0
  description: >-
    Private service API consumed only by Codestra Middleware. Public callers use
    api.codestra.co through Kong and Middleware; they never call this API directly.
servers:
  - url: https://social-internal.codestra.invalid
    description: Placeholder private service name; never publish this hostname.
security:
  - serviceOAuth: [social.commands.read]
    mutualTLS: []
paths:
  /internal/v1/social/media:
    post:
      operationId: registerSocialMediaArtifact
      summary: Register a Middleware-owned media artifact in Social tenant state
      security:
        - serviceOAuth: [social.media.write]
          mutualTLS: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaArtifactRegistration'
      responses:
        '201':
          description: Artifact registered without provider delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaArtifact'
        '409': { description: Idempotency key or asset identity conflicts with existing content }
  /internal/v1/social/media/{assetId}:
    get:
      operationId: getSocialMediaArtifact
      security:
        - serviceOAuth: [social.media.read]
          mutualTLS: []
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Tenant-scoped media artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaArtifact'
        '404': { description: Artifact not found in the caller tenant }
  /internal/v1/social/commands/publish:
    post:
      operationId: requestSocialPublication
      summary: Persist a publication command and return its durable identity
      security:
        - serviceOAuth: [social.commands.write]
          mutualTLS: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationCommand'
      responses:
        '202':
          description: Durable command accepted; publication may still be disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '409':
          description: Idempotency key was reused with a conflicting payload
        '422':
          description: Contract, tenant, capability, or provider validation failed
  /internal/v1/social/commands/{commandId}:
    get:
      operationId: getSocialCommand
      parameters:
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Command and per-channel delivery state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandStatus'
        '404': { description: Command not found in the caller tenant }
  /internal/v1/social/deliveries/{deliveryId}:
    get:
      operationId: getSocialDelivery
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Provider delivery, attempts, and reconciliation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '404': { description: Delivery not found in the caller tenant }
  /internal/v1/social/accounts/{accountId}/health:
    get:
      operationId: getSocialAccountHealth
      security:
        - serviceOAuth: [social.accounts.read]
          mutualTLS: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Connection health without provider credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountHealth'
        '404': { description: Account not found in the caller tenant }
  /health:
    get:
      security: []
      operationId: health
      responses:
        '200': { description: Process is running }
  /ready:
    get:
      security: []
      operationId: readiness
      responses:
        '200': { description: Required dependencies and safety state are ready }
        '503': { description: A required dependency or safety invariant failed }
  /version:
    get:
      security: []
      operationId: version
      responses:
        '200':
          description: Immutable release identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseIdentity'
components:
  securitySchemes:
    serviceOAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.codestra.co/realms/codestra/protocol/openid-connect/token
          scopes:
            social.commands.write: Create governed social commands
            social.commands.read: Read governed social commands
            social.deliveries.read: Read delivery and reconciliation state
            social.accounts.read: Read non-secret social-account health
            social.media.write: Register media artifacts from Middleware
            social.media.read: Read tenant media artifact metadata
    mutualTLS:
      type: mutualTLS
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 200 }
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommandId:
      name: commandId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
  schemas:
    MediaArtifactRegistration:
      type: object
      additionalProperties: false
      required: [asset_id, media_type, content_type, storage_reference, checksum_sha256]
      properties:
        asset_id: { type: string, format: uuid }
        media_type: { enum: [video, image, audio, document, other] }
        content_type: { type: string, minLength: 3, maxLength: 255 }
        storage_reference: { type: string, minLength: 1, maxLength: 2048 }
        checksum_sha256: { type: string, pattern: '^[0-9a-fA-F]{64}      type: object
      additionalProperties: false
      required: [command_version, post, targets]
      properties:
        command_version: { const: '1.0' }
        requested_by: { type: string, minLength: 1, maxLength: 200 }
        schedule_at: { type: [string, 'null'], format: date-time }
        post:
          type: object
          additionalProperties: false
          required: [content]
          properties:
            content: { type: string, maxLength: 100000 }
            media_ids:
              type: array
              maxItems: 20
              items: { type: string }
            metadata: { type: object, additionalProperties: true }
        targets:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [account_id, provider, settings]
            properties:
              account_id: { type: string }
              provider: { type: string }
              settings: { type: object, additionalProperties: true }
    CommandAccepted:
      type: object
      required: [command_id, state, idempotency_replayed, publishing_enabled]
      properties:
        command_id: { type: string, format: uuid }
        state: { enum: [requested, validated, persisted, queued, blocked] }
        idempotency_replayed: { type: boolean }
        publishing_enabled: { type: boolean }
    CommandStatus:
      type: object
      required: [command_id, state, deliveries]
      properties:
        command_id: { type: string, format: uuid }
        state:
          enum:
            [
              requested,
              validated,
              persisted,
              queued,
              accepted,
              reconciled,
              completed,
              failed,
              dead_lettered,
              blocked,
            ]
        deliveries:
          type: array
          items: { $ref: '#/components/schemas/Delivery' }
    Delivery:
      type: object
      required: [delivery_id, account_id, provider, state, attempt]
      properties:
        delivery_id: { type: string, format: uuid }
        account_id: { type: string }
        provider: { type: string }
        state:
          enum:
            [
              pending,
              publishing,
              provider_accepted,
              published,
              retry_wait,
              failed,
              dead_lettered,
              cancelled,
            ]
        attempt: { type: integer, minimum: 0 }
        provider_post_id: { type: [string, 'null'] }
        reconciled_at: { type: [string, 'null'], format: date-time }
        error_code: { type: [string, 'null'] }
    AccountHealth:
      type: object
      required: [account_id, provider, state]
      properties:
        account_id: { type: string }
        provider: { type: string }
        state: { enum: [healthy, expiring, reconnect_required, disabled] }
        scopes: { type: array, items: { type: string } }
        expires_at: { type: [string, 'null'], format: date-time }
    ReleaseIdentity:
      type: object
      required: [source_revision, image_digest, version, environment]
      properties:
        source_revision: { type: string }
        image_digest: { type: string }
        version: { type: string }
        environment: { type: string }
 }
        metadata: { type: object, additionalProperties: true }
    MediaArtifact:
      type: object
      additionalProperties: false
      required:
        [asset_id, tenant_id, media_type, content_type, storage_reference,
         checksum_sha256, correlation_id, idempotency_replayed,
         provider_delivery, created_at, updated_at]
      properties:
        asset_id: { type: string, format: uuid }
        tenant_id: { type: string }
        media_type: { type: string }
        content_type: { type: string }
        storage_reference: { type: string }
        checksum_sha256: { type: string }
        metadata: { type: object, additionalProperties: true }
        correlation_id: { type: string, format: uuid }
        idempotency_replayed: { type: boolean }
        provider_delivery: { const: disabled }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PublicationCommand:
      type: object
      additionalProperties: false
      required: [command_version, post, targets]
      properties:
        command_version: { const: '1.0' }
        requested_by: { type: string, minLength: 1, maxLength: 200 }
        schedule_at: { type: [string, 'null'], format: date-time }
        post:
          type: object
          additionalProperties: false
          required: [content]
          properties:
            content: { type: string, maxLength: 100000 }
            media_ids:
              type: array
              maxItems: 20
              items: { type: string }
            metadata: { type: object, additionalProperties: true }
        targets:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [account_id, provider, settings]
            properties:
              account_id: { type: string }
              provider: { type: string }
              settings: { type: object, additionalProperties: true }
    CommandAccepted:
      type: object
      required: [command_id, state, idempotency_replayed, publishing_enabled]
      properties:
        command_id: { type: string, format: uuid }
        state: { enum: [requested, validated, persisted, queued, blocked] }
        idempotency_replayed: { type: boolean }
        publishing_enabled: { type: boolean }
    CommandStatus:
      type: object
      required: [command_id, state, deliveries]
      properties:
        command_id: { type: string, format: uuid }
        state:
          enum:
            [
              requested,
              validated,
              persisted,
              queued,
              accepted,
              reconciled,
              completed,
              failed,
              dead_lettered,
              blocked,
            ]
        deliveries:
          type: array
          items: { $ref: '#/components/schemas/Delivery' }
    Delivery:
      type: object
      required: [delivery_id, account_id, provider, state, attempt]
      properties:
        delivery_id: { type: string, format: uuid }
        account_id: { type: string }
        provider: { type: string }
        state:
          enum:
            [
              pending,
              publishing,
              provider_accepted,
              published,
              retry_wait,
              failed,
              dead_lettered,
              cancelled,
            ]
        attempt: { type: integer, minimum: 0 }
        provider_post_id: { type: [string, 'null'] }
        reconciled_at: { type: [string, 'null'], format: date-time }
        error_code: { type: [string, 'null'] }
    AccountHealth:
      type: object
      required: [account_id, provider, state]
      properties:
        account_id: { type: string }
        provider: { type: string }
        state: { enum: [healthy, expiring, reconnect_required, disabled] }
        scopes: { type: array, items: { type: string } }
        expires_at: { type: [string, 'null'], format: date-time }
    ReleaseIdentity:
      type: object
      required: [source_revision, image_digest, version, environment]
      properties:
        source_revision: { type: string }
        image_digest: { type: string }
        version: { type: string }
        environment: { type: string }
