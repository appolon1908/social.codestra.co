global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: staging
    service: codestra-social

scrape_configs:
  - job_name: codestra-social-staging
    metrics_path: /api/metrics
    scheme: http
    static_configs:
      - targets: ['application:5000']
        labels:
          component: runtime
